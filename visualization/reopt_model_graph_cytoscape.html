<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>REopt Model Graph (Cytoscape, fixed)</title>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; }
    #cy { flex: 1 1 auto; height: 100vh; border-right: 1px solid #ccc; }
    #sidebar { width: 320px; padding: 10px; box-sizing: border-box; overflow-y: auto; }
    h2 { margin-top: 0; }
    .section { margin-bottom: 12px; }
    .badge { display: inline-block; width: 12px; height: 12px; margin-right: 6px; }
    pre { white-space: pre-wrap; font-family: monospace; }
    .hidden { opacity: 0.1; }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="sidebar">
    <h2>REopt Model Graph</h2>
    <div class="section">
      Click a node to see its metadata.
      <pre id="node-info">(none selected)</pre>
    </div>
    <div class="section">
      <h3>Edge domains</h3>
      <label><input type="checkbox" id="toggle-energy" checked> Energy (red)</label><br>
      <label><input type="checkbox" id="toggle-data" checked> Data (blue)</label><br>
      <label><input type="checkbox" id="toggle-money" checked> Money (green)</label>
    </div>
    <div class="section">
      <h3>Layers</h3>
      <label><input type="checkbox" id="layer-input" checked> Input</label><br>
      <label><input type="checkbox" id="layer-model" checked> Model</label><br>
      <label><input type="checkbox" id="layer-output" checked> Output</label>
    </div>
    <div class="section">
      <h3>Legend</h3>
      <div><span class="badge" style="background:red"></span>Energy / Leistung</div>
      <div><span class="badge" style="background:blue"></span>Data / Parameter</div>
      <div><span class="badge" style="background:green"></span>Money / Geld</div>
      <div style="margin-top:8px;">
        <em>Shapes:</em>
        <ul>
          <li>Ellipse: input/output</li>
          <li>Rectangle: technology/module</li>
          <li>Diamond: variable/constraint</li>
          <li>Hexagon: objective</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const graphData = {
  "nodes": [
    {

      "label": "Electric load / Elektrische Last",
      "type": "input",
      "layer": "input",
      "module": "src/core/electric_load.jl"
    },
    {

    },
    {

      "layer": "input",

    },
    {

    },
    {

    },

    },
    {

      "technology": "Battery"
    },
    {
      "id": "model_ashp",
      "label": "ASHP module (Flexible HVAC)",
      "type": "technology",
      "layer": "model",
      "module": "src/core/flexible_hvac.jl",
      "technology": "ASHP"
    },
    {
      "id": "model_grid",
      "label": "Grid & load balance / Netz & Lastbilanz",
      "type": "module",
      "layer": "model",
      "module": "src/constraints/load_balance.jl"
    },
    {
      "id": "model_financial",
      "label": "Financial module",

    },
    {
      "id": "var_capacities",
      "label": "Capacity decision variables",
      "type": "variable",

    },
    {

      "label": "Dispatch variables (power, storage, grid)",
      "type": "variable",
      "layer": "model",
      "module": "src/constraints/load_balance.jl"
    },
    {
      "id": "constraint_load_balance",
      "label": "Load balance constraints",
      "type": "constraint",
      "layer": "model",

    },
    {
      "id": "constraint_storage",
      "label": "Storage constraints",
      "type": "constraint",
      "layer": "model",
      "module": "src/constraints/storage_constraints.jl"
    },
    {
      "id": "objective_cost",
      "label": "Objective: minimize lifecycle cost",

    },
    {
      "id": "output_sizes",
      "label": "Optimal capacities / Optimale Anlagengrößen",
      "type": "output",

    },
    {
      "id": "output_dispatch",
      "label": "Dispatch time series",

    },
    {

      "label": "Economic KPIs / Wirtschaftliche Kennzahlen",
      "type": "output",
      "layer": "output",
      "module": "src/results/financial.jl"
    }
  ],
  "edges": [
    {
      "source": "input_electric_load",
      "target": "model_grid",
      "relation": "data feed",
      "domain": "data"
    },
    {
      "source": "input_heating_load",
      "target": "model_ashp",
      "relation": "data feed",
      "domain": "data"
    },
    {
      "source": "input_pv_resource",
      "target": "model_pv",
      "relation": "resource",
      "domain": "data"
    },
    {
      "source": "input_outdoor_temp",
      "target": "model_ashp",
      "relation": "ambient data",
      "domain": "data"
    },
    {
      "source": "input_electric_tariff",
      "target": "model_grid",
      "relation": "rates",
      "domain": "data"
    },
    {
      "source": "input_electric_tariff",
      "target": "model_financial",
      "relation": "rates",
      "domain": "data"
    },
    {
      "source": "input_financial_params",
      "target": "model_financial",
      "relation": "parameters",
      "domain": "data"
    },
    {
      "source": "var_capacities",
      "target": "objective_cost",
      "relation": "decision",
      "domain": "data"
    },
    {
      "source": "var_dispatch",
      "target": "constraint_load_balance",
      "relation": "constrained_by",
      "domain": "data"
    },
    {
      "source": "constraint_load_balance",
      "target": "objective_cost",
      "relation": "feasibility",
      "domain": "data"
    },
    {
      "source": "constraint_storage",
      "target": "objective_cost",
      "relation": "feasibility",
      "domain": "data"
    },
    {
      "source": "model_pv",
      "target": "model_grid",
      "relation": "electric supply",
      "domain": "energy"
    },
    {
      "source": "model_pv",
      "target": "model_battery",
      "relation": "charge battery",
      "domain": "energy"
    },
    {
      "source": "model_pv",
      "target": "model_grid",
      "relation": "export",
      "domain": "energy"
    },
    {
      "source": "model_battery",
      "target": "model_grid",
      "relation": "discharge",
      "domain": "energy"
    },
    {
      "source": "model_ashp",
      "target": "model_grid",
      "relation": "electric consumption",
      "domain": "energy"
    },
    {
      "source": "model_ashp",
      "target": "input_heating_load",
      "relation": "heat supplied",
      "domain": "energy"
    },
    {
      "source": "model_grid",
      "target": "model_financial",
      "relation": "utility costs",
      "domain": "money"
    },
    {
      "source": "model_pv",
      "target": "model_financial",
      "relation": "capex/opex",
      "domain": "money"
    },
    {
      "source": "model_battery",
      "target": "model_financial",
      "relation": "capex/opex",
      "domain": "money"
    },
    {
      "source": "model_ashp",
      "target": "model_financial",
      "relation": "capex/opex",
      "domain": "money"
    },
    {
      "source": "objective_cost",
      "target": "output_economic",
      "relation": "optimizes",
      "domain": "money"
    },
    {
      "source": "model_financial",
      "target": "output_economic",
      "relation": "calculates",
      "domain": "money"
    },
    {
      "source": "var_capacities",
      "target": "output_sizes",
      "relation": "results",
      "domain": "money"
    },
    {
      "source": "var_dispatch",
      "target": "output_dispatch",
      "relation": "results",
      "domain": "money"
    },
    {
      "source": "model_grid",
      "target": "output_dispatch",
      "relation": "power flows",
      "domain": "energy"
    }
  ]
};

    function buildElements(data) {
      const elements = [];
      data.nodes.forEach(n => {
        elements.push({
          data: {
            id: n.id,
            label: n.label,
            type: n.type,
            layer: n.layer,
            module: n.module || "",
            technology: n.technology || ""
          }
        });
      });
      data.edges.forEach((e, idx) => {
        elements.push({
          data: {
            id: "e" + idx,
            source: e.source,
            target: e.target,
            relation: e.relation || "",
            domain: e.domain || "data"
          }
        });
      });
      return elements;
    }

    function edgeColor(domain) {
      if (domain === "energy") return "red";
      if (domain === "money") return "green";
      return "blue";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const elements = buildElements(graphData);

      const cy = cytoscape({
        container: document.getElementById("cy"),
        elements: elements,
        style: [
          {
            selector: "node",
            style: {
              "label": "data(label)",
              "text-wrap": "wrap",
              "text-max-width": 120,
              "font-size": 10,
              "background-color": "#eee",
              "border-width": 1,
              "border-color": "#555",
              "padding": "6px"
            }
          },
          {
            selector: "node[type = 'input'], node[type = 'output']",
            style: { "shape": "ellipse" }
          },
          {
            selector: "node[type = 'technology'], node[type = 'module']",
            style: { "shape": "round-rectangle" }
          },
          {
            selector: "node[type = 'variable'], node[type = 'constraint']",
            style: { "shape": "diamond" }
          },
          {
            selector: "node[type = 'objective']",
            style: { "shape": "hexagon" }
          },
          {
            selector: "edge",
            style: {
              "curve-style": "bezier",
              "target-arrow-shape": "triangle",
              "width": 2,
              "line-color": "data(color)",
              "target-arrow-color": "data(color)"
            }
          },
          {
            selector: ".hidden",
            style: { "opacity": 0.1 }
          }
        ],
        layout: {
          name: "breadthfirst",
          directed: true,
          spacingFactor: 1.4,
          sort: (a, b) => {
            const order = { input: 0, model: 1, output: 2 };
            const la = order[a.data("layer")] ?? 1;
            const lb = order[b.data("layer")] ?? 1;
            return la - lb;
          }
        }
      });

      // set edge colors from domain
      cy.edges().forEach(e => {
        const domain = e.data("domain") || "data";
        e.data("color", edgeColor(domain));
      });

      const info = document.getElementById("node-info");
      cy.on("tap", "node", (evt) => {
        const d = evt.target.data();
        info.textContent =
          "ID: " + d.id + "\n" +
          "Label: " + d.label + "\n" +
          "Type: " + d.type + "\n" +
          "Layer: " + d.layer + "\n" +
          "Module: " + (d.module || "") + "\n" +
          "Technology: " + (d.technology || "");
      });

      function applyFilters() {
        const showEnergy = document.getElementById("toggle-energy").checked;
        const showData   = document.getElementById("toggle-data").checked;
        const showMoney  = document.getElementById("toggle-money").checked;
        const showInput  = document.getElementById("layer-input").checked;
        const showModel  = document.getElementById("layer-model").checked;
        const showOutput = document.getElementById("layer-output").checked;

        cy.edges().forEach(e => {
          const domain = e.data("domain") || "data";
          const visible =
            (domain === "energy" && showEnergy) ||
            (domain === "data"   && showData)   ||
            (domain === "money"  && showMoney);
          e.toggleClass("hidden", !visible);
        });

        cy.nodes().forEach(n => {
          const layer = n.data("layer");
          const visible =
            (layer === "input"  && showInput) ||
            (layer === "model"  && showModel) ||
            (layer === "output" && showOutput);
          n.toggleClass("hidden", !visible);
        });
      }

      ["toggle-energy","toggle-data","toggle-money",
       "layer-input","layer-model","layer-output"].forEach(id => {
        document.getElementById(id).addEventListener("change", applyFilters);
      });

      applyFilters();
    });
  </script>
</body>
</html>
